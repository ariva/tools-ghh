[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.1"
edition = "2024"
authors = ["Arunas Ivanauskas <236536+ariva@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/ariva/tools-ghh"

[workspace.dependencies]
thiserror = "2"
arboard = "3"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
git2 = "0.19"
json5 = "0.4"
libc = "0.2"
libgit2-sys = "0.17"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
